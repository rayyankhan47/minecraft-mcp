#Minecraft server properties — MC MCP demo configuration
#
# Canonical copy, tracked in git. server/ is gitignored, so this is the only place
# these settings survive. scripts/setup-server.sh installs it.
#
# The values below are NOT cosmetic. Several of them exist specifically to prevent
# demo-time failures:
#
#   max-tick-time=-1        CRITICAL. Disables Paper's watchdog. Heavy block placement
#                           can blow past the default 60s tick threshold and the
#                           watchdog will hard-kill the server mid-build.
#   level-type=flat         Clean canvas — builds read clearly on camera.
#   allow-flight=true       You need to fly for camera angles during the demo.
#   online-mode=false       Removes Mojang auth as a dependency on venue wifi.
#   spawn-protection=0      Otherwise block placement near spawn is silently refused.
#   force-gamemode=true     Always rejoin in creative, whatever the playerdata says.
#   enforce-secure-profile  Must be false when online-mode=false, or chat signing
#                           rejects the unauthenticated session.

accepts-transfers=false
allow-flight=true
allow-nether=false
broadcast-console-to-ops=true
broadcast-rcon-to-ops=true
bug-report-link=
debug=false
difficulty=peaceful
enable-code-of-conduct=false
enable-jmx-monitoring=false
enable-query=false
enable-rcon=false
enable-status=true
enforce-secure-profile=false
enforce-whitelist=false
entity-broadcast-range-percentage=100
force-gamemode=true
function-permission-level=2
gamemode=creative
generate-structures=false
generator-settings={}
hardcore=false
hide-online-players=false
initial-disabled-packs=
initial-enabled-packs=vanilla
level-name=world
level-seed=
level-type=minecraft\:flat
log-ips=true
management-server-allowed-origins=
management-server-enabled=false
management-server-host=localhost
management-server-port=0
management-server-secret=
management-server-tls-enabled=true
management-server-tls-keystore=
management-server-tls-keystore-password=
max-chained-neighbor-updates=1000000
max-players=20
max-tick-time=-1
max-world-size=29999984
motd=MC MCP
network-compression-threshold=256
online-mode=false
op-permission-level=4
pause-when-empty-seconds=-1
player-idle-timeout=0
prevent-proxy-connections=false
query.port=25565
rate-limit=0
rcon.password=
rcon.port=25575
region-file-compression=deflate
require-resource-pack=false
resource-pack=
resource-pack-id=
resource-pack-prompt=
